name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  configure:
    name: Configure (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC
            os: windows-2022
            generator: Visual Studio 17 2022
            cxx: cl
          - name: macOS Apple Clang
            os: macos-15
            generator: Xcode
            cxx: clang++
          - name: Linux GCC
            os: ubuntu-24.04
            generator: Unix Makefiles
            cxx: g++
          - name: Linux Clang
            os: ubuntu-24.04
            generator: Unix Makefiles
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL3 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev
      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}"

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check C++ formatting
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(git ls-files -z -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.C' \
            '*.h' '*.hh' '*.hpp' '*.hxx' '*.H' \
            '*.inl' '*.ipp' '*.tpp' '*.ixx' '*.cppm')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No C++ source or header files to check."
            exit 0
          fi

          clang-format-18 --version
          clang-format-18 --dry-run --Werror --style=file -- "${files[@]}"
